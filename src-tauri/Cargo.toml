[package]
name = "qiuniu"
version = "1.0.0"
description = "QiuNiu — music player and system widget"
authors = ["ref42"]
edition = "2021"

[lib]
name = "qiuniu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["macos-private-api"] }
tauri-plugin-opener = "2.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

sysinfo = "0.30"
windows-sys = { version = "0.59", features = [
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
] }
tauri-plugin-single-instance = "2.0.0"
tokio = { version = "1", features = ["full", "rt-multi-thread"] }
urlencoding = "2.1.3"
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2.5.1"
winapi = { version = "0.3.9", features = ["winuser", "windef", "shellapi"] }
reqwest = { version = "0.12", features = ["json"] }
windows = { version = "0.58.0", features = [
    "UI_Notifications_Management",
    "UI_Notifications",
    "Foundation",
    "Foundation_Collections",
    "ApplicationModel",
    "implement",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Media_Control",
    "Storage_Streams",
    "Win32_System_Power",
] }
cpal = "0.17.3"
rustfft = "6.4.1"
rodio = { version = "0.22", features = ["mp3", "flac", "vorbis", "wav", "mp4"] }
symphonia = { version = "0.6.0", default-features = false, features = ["mp3", "aac", "isomp4", "pcm", "flac", "vorbis", "wav"] }
log = "0.4"
