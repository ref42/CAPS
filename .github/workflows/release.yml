name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install nightly --profile minimal
          rustup default nightly
          rustc -Vv
          cargo -Vv

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            windows-cargo-

      - name: Build release executable
        run: cargo build --release

      - name: Package executable
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "manual-$env:GITHUB_RUN_NUMBER" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/caps.exe "dist/CAPS-$tag-windows-x64.exe"
          Get-FileHash "dist/CAPS-$tag-windows-x64.exe" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  CAPS-$tag-windows-x64.exe" } |
            Set-Content "dist/CAPS-$tag-windows-x64.exe.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: CAPS-windows-x64
          path: dist/*

      - name: Publish GitHub release assets
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $notes = ".github/release-notes/$tag.md"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path $notes) {
              gh release create $tag --title $tag --notes-file $notes
            } else {
              gh release create $tag --title $tag --notes "CAPS $tag"
            }
          } elseif (Test-Path $notes) {
            # The release already existed — usually because it was published by
            # hand from the tag before this run finished — so it can have no
            # notes at all. Apply the tag's notes file instead of leaving the
            # page blank.
            gh release edit $tag --title $tag --notes-file $notes
          }
          gh release upload $tag "dist/CAPS-$tag-windows-x64.exe" "dist/CAPS-$tag-windows-x64.exe.sha256" --clobber
