[package]
name = "qiuniu"
version = "1.0.0"
description = "QiuNiu — music player and system widget"
authors = ["ref42"]
edition = "2024"

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
bundle = []

[dependencies]
dioxus = { version = "0.7.0", features = ["desktop"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.30"
tokio = { version = "1", features = ["full", "rt-multi-thread"] }
urlencoding = "2.1.3"
reqwest = { version = "0.12", features = ["json"] }
cpal = "0.17.3"
rustfft = "6.4.1"
rodio = { version = "0.22", features = ["mp3", "flac", "vorbis", "wav", "mp4"] }
log = "0.4"
