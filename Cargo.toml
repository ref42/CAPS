[package]
name = "caps"
version = "1.0.14"
description = "CAPS"
authors = ["ref42"]
edition = "2024"
build = "build.rs"

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
bundle = []

[dependencies]
dioxus = { version = "0.7.9", features = ["desktop"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
md-5 = "0.10.6"
base64 = "0.22.1"
sysinfo = "0.39.6"
tokio = { version = "1.53.1", features = ["full", "rt-multi-thread"] }
urlencoding = "2.1.3"
reqwest = { version = "0.13.4", features = ["json", "form"] }
rfd = "0.17.2"
image = "0.25.10"
cpal = "0.18.1"
rustfft = "6.4.1"
rodio = { version = "0.22.2", features = ["mp3", "flac", "vorbis", "wav", "mp4"] }
log = "0.4.33"
symphonia = { version = "0.6.0", features = ["mp3", "aac", "isomp4", "flac", "vorbis", "ogg", "wav", "all-meta"] }

[build-dependencies]
winresource = "0.1.31"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
