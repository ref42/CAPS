[package]
name = "caps"
version = "1.0.0"
description = "CAPS - capsule music island for desktop"
authors = ["ref42"]
edition = "2024"

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
bundle = []

[dependencies]
dioxus = { version = "0.7.9", features = ["desktop"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.39.6"
tokio = { version = "1.53.1", features = ["full", "rt-multi-thread"] }
urlencoding = "2.1.3"
reqwest = { version = "0.13.4", features = ["json", "form"] }
cpal = "0.18.1"
rustfft = "6.4.1"
rodio = { version = "0.22.2", features = ["mp3", "flac", "vorbis", "wav", "mp4"] }
log = "0.4.33"
